; Preset d'export Web (HTML5) du client.
;
; `variant/thread_support=false` est deliberé : la variante avec threads exige
; les en-tetes COOP/COEP cote serveur, et la page reste blanche s'ils manquent.
; La variante sans threads fonctionne partout, y compris derriere un serveur
; statique quelconque. Caddy envoie quand meme les en-tetes (voir Caddyfile),
; ce qui permet de repasser a true sans autre changement.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
html/show_advanced_settings=false
progressive_web_app/enabled=false
